name: Build and Test

on:
  push:
    branches: [ 'v[1-9][0-9].0' ]
  pull_request:
    branches: [ 'v[1-9][0-9].0' ]
  schedule:
    - cron: 0 6 * * 1

jobs:
  automerge:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - uses: fastify/github-action-merge-dependabot@v3.12.0
        with:
          use-github-auto-merge: true

  build-and-test:
    name: build-and-test on ${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET environment
        uses: ./.github/actions/setup-dotnet
      - name: Test
        run: dotnet test --no-build --no-restore --verbosity normal --logger trx --results-directory ${{ runner.temp }}

      - name: Convert TRX to VS Playlist
        if: failure()
        uses: BenjaminMichaelis/trx-to-vsplaylist@v4
        with:
          trx-file-path: '${{ runner.temp }}/*.trx'
          output-directory: '${{ runner.temp }}/vsplaylists'
